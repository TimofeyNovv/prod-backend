workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

stages:
  - test
  - build
  - deploy

test:
  stage: test
  image: maven:3.9-eclipse-temurin-17

  tags:
    - prod-backend

  rules:
    - when: on_success

  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    MAVEN_OPTS: "-Xmx512m"

  cache:
    key: maven-java17
    paths:
      - .m2/repository/

  before_script:
    - test -S /var/run/docker.sock
    - getent hosts host.docker.internal

  script:
    - mvn -B -ntp -Dmaven.repo.local="$CI_PROJECT_DIR/.m2/repository" clean verify

  artifacts:
    when: always
    expire_in: 7 days

    paths:
      - target/surefire-reports/
      - target/failsafe-reports/
      - target/site/jacoco-unit/
      - target/site/jacoco-integration/
      - target/site/jacoco/
      - target/*.jar

    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml

      coverage_report:
        coverage_format: jacoco
        path: target/site/jacoco/jacoco.xml

build-image:
  stage: build
  image: docker:29-cli
  tags:
    - prod-backend
  needs:
    - job: test
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  after_script:
    - docker logout "$CI_REGISTRY"

deploy:
  stage: deploy
  image: alpine:3.22
  tags:
    - prod-backend
  needs:
    - job: build-image
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  resource_group: prod-backend-production
  interruptible: false
  environment:
    name: production
    url: https://$DEPLOY_HOST
  before_script:
    - apk add --no-cache openssh-client curl
    - test -s "$SSH_PRIVATE_KEY"
    - test -s "$SSH_KNOWN_HOSTS"
    - chmod 600 "$SSH_PRIVATE_KEY"
    - mkdir -p "$HOME/.ssh"
    - chmod 700 "$HOME/.ssh"
    - cp "$SSH_KNOWN_HOSTS" "$HOME/.ssh/known_hosts"
    - chmod 644 "$HOME/.ssh/known_hosts"
  script:
    - scp -i "$SSH_PRIVATE_KEY" -o BatchMode=yes -o StrictHostKeyChecking=yes compose.prod.yaml "$DEPLOY_USER@$DEPLOY_HOST:/opt/prod-backend/compose.prod.yaml"
    - |
      ssh -i "$SSH_PRIVATE_KEY" \
        -o BatchMode=yes \
        -o StrictHostKeyChecking=yes \
        "$DEPLOY_USER@$DEPLOY_HOST" \
        "bash -s -- '$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA'" <<'REMOTE'
      set -eu
      cd /opt/prod-backend
      printf 'APP_IMAGE=%s\n' "$1" > .image.env

      compose() {
        docker compose --env-file .env --env-file .image.env -f compose.prod.yaml "$@"
      }

      compose pull app
      if ! compose up -d --wait --wait-timeout 180; then
        compose ps
        compose logs --no-color --tail 100 app postgres
        exit 1
      fi
      REMOTE
    - curl --fail --silent --show-error --max-time 30 --retry 5 --retry-delay 3 --retry-all-errors "https://$DEPLOY_HOST/actuator/health/readiness"
    - curl --fail --silent --show-error --max-time 30 --retry 5 --retry-delay 3 --retry-all-errors --output /dev/null "https://$DEPLOY_HOST/v3/api-docs"